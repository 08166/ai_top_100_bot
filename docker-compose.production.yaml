services:
  bot:
    build:
      target: production-stage
    # 심사 기간 무인 운영: 비정상 종료와 서버·Docker 재부팅 모두에서 다시 띄움 (on-failure는 데몬 재시작 시 재기동 안 함)
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # 심사관 대화 기록 보관. 재빌드·재시작에도 유지됨 (down -v, system prune --volumes 금지)
    volumes:
      - conversation-logs:/app/data

volumes:
  conversation-logs:
