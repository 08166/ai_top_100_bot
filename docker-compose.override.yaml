services:
  bot:
    image: kakao-bot:dev
    build:
      target: develop-stage
    develop:
      watch:
        - action: sync+restart
          path: ./
          target: /app
          ignore:
            - tests/
            - .pytest_cache/
            - __pycache__/
            - .venv/
            - data/
        - action: rebuild
          path: poetry.lock

  test:
    image: kakao-bot:dev
    build:
      context: .
      target: develop-stage
    command: ["ptw", ".", "--now"]
    develop:
      watch:
        - action: sync
          path: ./
          target: /app
          ignore:
            - .pytest_cache/
            - __pycache__/
            - .venv/
            - data/
        - action: rebuild
          path: poetry.lock
